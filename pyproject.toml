[project]
name = "gtfs-dleung"
version = "0.1.0"
description = "GTFS-RT exploration spike for the MBTA Red Line + Green Line E branch — recruiter-demo deliverable."
authors = [{ name = "David Leung" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.13,<3.14"
keywords = ["gtfs", "gtfs-rt", "mbta", "transit", "streamlit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "gtfs-kit>=10.0.0",
    "gtfs-realtime-bindings>=1.0.0",
    "requests>=2.32.0",
    "pandas>=2.2.0",
    "folium>=0.17.0",
    "streamlit>=1.36.0",
    "streamlit-authenticator>=0.3.2",
    "streamlit-autorefresh>=1.0.0",
    "bcrypt>=4.2.0",
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
]

[project.urls]
Homepage = "https://github.com/dcltdw/gtfs-dleung"
Repository = "https://github.com/dcltdw/gtfs-dleung"
Issues = "https://github.com/dcltdw/gtfs-dleung/issues"

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "types-requests>=2.32.0",
    "pandas-stubs>=2.2.0",
    "pre-commit>=3.8.0",
    "detect-secrets>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gtfs_dleung"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line-too-long — handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"] # allow assert False in tests

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "gtfs_kit.*",
    "google.transit.*",
    "folium.*",
    "streamlit.*",
    "streamlit_authenticator.*",
    "streamlit_autorefresh.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers --strict-config"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:google.*",
]
markers = [
    "live: opt-in tests that hit real MBTA endpoints or spawn real subprocesses (run nightly via #49; excluded from PR CI via `pytest -m 'not live'`)",
]
